<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>一日英國人：女皇陛下萬歲！</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/player.css">
  <link rel="stylesheet" href="./css/host.css">
  <!-- 讓 js/store.js 的 firebase/* 匯入對到自行託管的 SDK，不向外部主機要任何檔案。 -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "./vendor/firebase/firebase-app.js",
        "firebase/auth": "./vendor/firebase/firebase-auth.js",
        "firebase/database": "./vendor/firebase/firebase-database.js"
      }
    }
  </script>
  <script type="module" src="./js/app.js"></script>
</head>
<body data-phase="day">
  <div class="topbar">
    <p id="connection" class="connection" role="status" hidden>連線中斷，正在重新連線…</p>
    <div class="alerts">
      <p id="notice" class="notice" role="status" hidden></p>
      <p id="data-problem" class="notice" role="alert" hidden>卡牌資料有問題，請找工作人員</p>
    </div>
  </div>

  <section id="screen-loading" class="page">
    <p class="loading">連線中…</p>
    <noscript><p class="notice">這個遊戲需要開啟 JavaScript。</p></noscript>
    <p id="unsupported" class="notice" hidden>這支手機的瀏覽器版本太舊，請更新系統或改用新版 Chrome／Safari。</p>
  </section>

  <section id="screen-home" class="page" hidden>
    <header class="hero">
      <p class="hero-latin" lang="en">LONDON · MDCCCLXXXVIII</p>
      <h1 class="hero-title">一日英國人</h1>
      <p class="hero-sub">女皇陛下萬歲！</p>
    </header>

    <form id="join-form" class="join" autocomplete="off" novalidate>
      <div class="field">
        <label class="field-label" for="join-code">房號</label>
        <div id="join-code-cells" class="code-field">
          <input id="join-code" class="code-input" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-describedby="join-code-hint" required>
        </div>
        <p id="join-code-hint" class="field-hint">主持人投影上的房號，英文不分大小寫</p>
      </div>
      <div class="field">
        <label class="field-label" for="join-name">你的名字</label>
        <input id="join-name" class="input" autocomplete="off" aria-describedby="join-name-hint" required>
        <p id="join-name-hint" class="field-hint">同桌玩家看得到</p>
      </div>
      <fieldset class="field table-field">
        <legend class="field-label">你坐第幾桌<span id="join-table-picked" class="picked"></span></legend>
        <div id="join-table" class="table-pick"></div>
        <p id="join-table-hint" class="field-hint">選你實際坐的那一桌</p>
      </fieldset>
      <button id="join-submit" type="submit" class="btn btn-primary btn-block join-submit">加入</button>
      <p id="join-foot" class="join-foot"></p>
    </form>

    <section class="host-entry" aria-labelledby="host-entry-title">
      <h2 id="host-entry-title">主持端</h2>
      <button id="create-room" type="button" class="btn">開新房（主持端）</button>
      <form id="host-form" autocomplete="off">
        <label class="field" for="host-join-code"><span class="field-label">已經有房間：輸入房號</span></label>
        <input id="host-join-code" class="input" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="6" placeholder="6 碼英數字" required>
        <button type="submit" class="btn">以主持端進入</button>
      </form>
    </section>
  </section>

  <section id="screen-pending" class="page" hidden>
    <div class="pending">
      <span class="field-label">確認碼</span>
      <strong id="pending-confirm" class="pending-code"></strong>
      <p class="pending-note">等待主持端核准。請主持端核對畫面上的確認碼與這裡相同再核准；核准後會自動進入主持畫面。</p>
      <p class="room-line">房號 <span id="pending-code" class="num"></span></p>
      <button id="pending-cancel" type="button" class="btn btn-block">取消申請</button>
    </div>
  </section>

  <section id="screen-host" class="host-screen" hidden>
    <div class="card room-code">
      <span>房號</span>
      <strong id="host-code"></strong>
    </div>
    <div id="host-tables" class="tables"></div>
    <div class="card">
      <h2>主持端</h2>
      <p id="host-count" class="host-count"></p>
      <ul id="host-requests" class="requests"></ul>
    </div>
    <button id="host-leave" type="button" class="quiet">離開</button>
  </section>

  <section id="screen-player" class="player" hidden>
    <header id="player-head" class="phase-head"></header>
    <main id="player-view" class="player-view"></main>
    <div class="dock">
      <div id="player-actions" class="action-bar" hidden></div>
      <nav class="tab-bar" aria-label="分頁">
        <button type="button" class="tab" data-tab="action" aria-pressed="true"><span class="tab-icon tab-icon-action" aria-hidden="true"></span>行動</button>
        <button type="button" class="tab" data-tab="role" aria-pressed="false"><span class="tab-icon tab-icon-role" aria-hidden="true"></span>階層</button>
        <button type="button" class="tab" data-tab="mates" aria-pressed="false"><span class="tab-icon tab-icon-mates" aria-hidden="true"></span>同桌</button>
        <button type="button" class="tab" data-tab="log" aria-pressed="false"><span class="tab-icon tab-icon-log" aria-hidden="true"></span>紀錄</button>
        <button type="button" id="destiny-hold" class="tab tab-destiny" aria-describedby="destiny-hold-hint"><span class="tab-icon tab-icon-destiny" aria-hidden="true"></span><span class="tab-destiny-label">天命・按住看</span></button>
      </nav>
      <p id="destiny-hold-hint" class="sr-only">按住不放才顯示你的隱藏天命，放開就收起來</p>
    </div>
    <div id="destiny-sheet" class="destiny-sheet" hidden></div>
  </section>

  <script>
    // 不支援 import map 的舊瀏覽器載不了上面的模組，這裡給一句說明，免得畫面停在「連線中」。
    if (!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
      document.getElementById('unsupported').hidden = false;
    }
  </script>
</body>
</html>
